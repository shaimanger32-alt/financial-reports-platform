[project]
name = "fri-ingestion"
version = "0.1.0"
description = "Provider clients, parsers and pipelines. MAGNA is provider one, not the domain."
requires-python = ">=3.12"
dependencies = [
    "fri-financial-core",
    "fri-database",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
