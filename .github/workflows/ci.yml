name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fri
          POSTGRES_PASSWORD: fri
          POSTGRES_DB: fri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://fri:fri@127.0.0.1:5432/fri_test
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --all-packages
          npm ci

      - name: Apply migrations
        run: uv run alembic -c database/alembic.ini upgrade head

      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy financial_core/src database/src ingestion/src services/api/src
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Test
        run: uv run pytest

      - name: Build web
        run: npm run build
