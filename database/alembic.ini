[alembic]
# %(here)s resolves relative to this file, so alembic works from any directory.
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# The URL is supplied at runtime from DATABASE_URL (see migrations/env.py).
# It is deliberately absent here so credentials never enter the repository.
sqlalchemy.url =

# Timestamped, ordered filenames make the migration history readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# ruff ships a native binary rather than a console_scripts entrypoint,
# so it is invoked with the "exec" hook type.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
