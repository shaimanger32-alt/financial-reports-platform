[project]
name = "fri-database"
version = "0.1.0"
description = "PostgreSQL persistence layer: models, sessions and migrations."
requires-python = ">=3.12"
dependencies = [
    "fri-financial-core",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]
