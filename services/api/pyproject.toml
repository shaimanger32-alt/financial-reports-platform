[project]
name = "fri-api"
version = "0.1.0"
description = "FastAPI service. A thin transport layer over financial_core and database."
requires-python = ">=3.12"
dependencies = [
    "fri-financial-core",
    "fri-database",
    "fri-ingestion",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
