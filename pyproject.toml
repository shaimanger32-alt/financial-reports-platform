[tool.uv.workspace]
members = ["financial_core", "database", "ingestion", "services/api"]

[tool.uv.sources]
fri-financial-core = { workspace = true }
fri-database = { workspace = true }
fri-ingestion = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

# --------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "financial_core/src",
    "database/src",
    "ingestion/src",
    "services/api/src",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    # The product is Hebrew-first, so Hebrew literals are everywhere and the
    # "ambiguous unicode character" rules fire on every one of them.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Alembic templates carry op/sa/Sequence imports that a given revision may not
# use. Stripping them breaks the next autogenerated revision in that file.
# Line length is left to the generator.
"database/migrations/versions/*" = ["F401", "I001", "E501"]

# --------------------------------------------------------------------------
# Type checking
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
mypy_path = [
    "financial_core/src",
    "database/src",
    "ingestion/src",
    "services/api/src",
]

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
    "financial_core/tests",
    "database/tests",
    "ingestion/tests",
    "services/api/tests",
    "tests",
]
markers = [
    "integration: requires a live PostgreSQL database",
]
# Default "prepend" import mode is kept on purpose. Under "importlib" pytest
# derives module names from paths, so database/tests/... would collide with the
# installed `database` package. Test file basenames are therefore unique.
addopts = "-q --strict-markers"
